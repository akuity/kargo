apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kargo-argocd-helm-chart-image
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - stage: test
      - stage: uat
      - stage: prod
  template:
    metadata:
      name: kargo-argocd-helm-chart-image-{{stage}}
      annotations:
        kargo.akuity.io/authorized-stage: kargo-argocd-helm-chart-image:{{stage}}
    spec:
      project: default
      source:
        repoURL: https://grafana-community.github.io/helm-charts
        chart: grafana
        # Kargo will update targetRevision to move new charts into each stage
        targetRevision: placeholder
        helm:
          parameters:
          # Kargo will update this value to move new images into each stage
          - name: image.tag
            value: placeholder
      destination:
        server: https://kubernetes.default.svc
        namespace: kargo-argocd-helm-chart-image-{{stage}}
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
  ignoreApplicationDifferences:
  - jqPathExpressions:
    - .spec.source.targetRevision
    - .spec.source.helm.parameters
