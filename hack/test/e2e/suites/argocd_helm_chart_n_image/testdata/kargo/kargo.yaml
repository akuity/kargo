apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargo-argocd-helm-chart-image
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: kargo-demo
  namespace: kargo-argocd-helm-chart-image
spec:
  subscriptions:
  - chart:
      repoURL: https://grafana-community.github.io/helm-charts
      name: grafana # Watch for new versions of this chart
      semverConstraint: ^12.0.0
  - image:
      repoURL: docker.io/grafana/grafana # Watch for new versions of this image
      semverConstraint: ^13.0
---
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promo-process
  namespace: kargo-argocd-helm-chart-image
spec:
  vars:
  - name: chartRepo
    value: https://grafana-community.github.io/helm-charts
  - name: imageRepo
    value: docker.io/grafana/grafana
  steps:
  - uses: argocd-update
    config:
      apps:
      - name: ${{ ctx.project }}-${{ ctx.stage }}
        sources:
        - repoURL: ${{ vars.chartRepo }}
          chart: grafana
          desiredRevision: ${{ chartFrom(vars.chartRepo, "grafana").Version }}
          updateTargetRevision: true
          helm:
            images:
            - key: image.tag
              value: ${{ imageFrom(vars.imageRepo).Tag }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: test
  namespace: kargo-argocd-helm-chart-image
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: kargo-demo
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: promo-process
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: uat
  namespace: kargo-argocd-helm-chart-image
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: kargo-demo
    sources:
      stages:
      - test
  promotionTemplate:
    spec:
      steps:
      - task:
          name: promo-process
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: kargo-argocd-helm-chart-image
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: kargo-demo
    sources:
      stages:
      - uat
  promotionTemplate:
    spec:
      steps:
      - task:
          name: promo-process
