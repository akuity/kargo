apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kargo-argocd-helm-image-gitrepo
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - stage: test
      - stage: uat
      - stage: prod
  template:
    metadata:
      name: kargo-argocd-helm-image-gitrepo-{{stage}}
      annotations:
        kargo.akuity.io/authorized-stage: kargo-argocd-helm-image-gitrepo:{{stage}}
    spec:
      project: default
      source:
        repoURL: https://github.com/<github-username>/kargo-demo-gitops.git
        targetRevision: new-helm
        path: charts/kargo-demo
        helm:
          parameters:
          # Kargo will update this value to move new images into each stage
          - name: image.name
            value: public.ecr.aws/nginx/nginx:placeholder
      destination:
        server: https://kubernetes.default.svc
        namespace: kargo-argocd-helm-image-gitrepo-{{stage}}
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
  ignoreApplicationDifferences:
  - jqPathExpressions:
    - .spec.source.helm.parameters
