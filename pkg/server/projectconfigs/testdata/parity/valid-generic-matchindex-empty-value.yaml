# want: valid
# matchIndices value present but empty is accepted
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-demo
  namespace: kargo-demo
spec:
  webhookReceivers:
  - name: gen
    generic:
      secretRef:
        name: s
      actions:
      - action: Refresh
        targetSelectionCriteria:
        - kind: Warehouse
          indexSelector:
            matchIndices:
            - key: subscribedURLs
              operator: Equals
              value: ""
