version: "2"
sql:
- engine: postgresql
  schema: db/migrations
  queries: db/queries
  gen:
    go:
      package: database
      out: pkg/database
      sql_package: pgx/v5
      # Row structs are named *Row so they are not mistaken for the API
      # types of the same name; a store layer converts between the two.
      rename:
        project: ProjectRow
      overrides:
      - db_type: timestamptz
        go_type:
          import: time
          type: Time
      - db_type: uuid
        go_type:
          import: github.com/google/uuid
          type: UUID
