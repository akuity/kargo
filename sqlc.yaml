version: "2"
sql:
- engine: postgresql
  schema: db/migrations
  queries: db/queries
  gen:
    go:
      package: database
      out: pkg/database
      sql_package: pgx/v5
      # Row structs are named *Row so they are not mistaken for the API
      # types of the same name; a store layer converts between the two.
      rename:
        project: ProjectRow
        target: TargetRow
      overrides:
      # Labels are a string map and params an object of opaque JSON values,
      # both enforced by the schema. sqlc cannot name a type from the package
      # it generates, so the columns map to types from elsewhere; pgx encodes
      # and decodes JSONB through encoding/json for any Go type.
      - column: targets.labels
        go_type:
          import: k8s.io/apimachinery/pkg/labels
          type: Set
      - column: targets.params
        go_type:
          import: encoding/json
          type: RawMessage
      - db_type: timestamptz
        go_type:
          import: time
          type: Time
      - db_type: uuid
        go_type:
          import: github.com/google/uuid
          type: UUID
