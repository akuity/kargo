version: "2"
sql:
- engine: postgresql
  schema: db/migrations
  queries: db/queries
  gen:
    go:
      package: database
      out: pkg/database
      sql_package: pgx/v5
      rename:
        repo_url: RepoURL
      overrides:
      - db_type: timestamptz
        go_type:
          import: time
          type: Time
