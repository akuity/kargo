suite: controller/deployment.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/controller/deployment.yaml
  - templates/controller/configmap.yaml
tests:
  - it: renders the controller Deployment by default
    template: templates/controller/deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: kargo-controller
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.spec.serviceAccountName
          value: kargo-controller
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: kargo-controller

  - it: is not rendered when the controller is disabled
    template: templates/controller/deployment.yaml
    set:
      controller.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: mounts the chart-generated API server CA
    template: templates/controller/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /etc/kargo/api-ca.crt
            name: api-ca
            subPath: ca.crt
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: api-ca
            secret:
              secretName: kargo-api-cert
              items:
              - key: ca.crt
                path: ca.crt

  - it: mounts no API server CA when the API server serves plain HTTP
    template: templates/controller/deployment.yaml
    set:
      api.tls.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: api-ca
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: api-ca
          any: true

  - it: mounts no API server CA when the controller is pointed elsewhere
    template: templates/controller/deployment.yaml
    set:
      controller.apiServer.address: https://kargo.example.com
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: api-ca
          any: true

  - it: declares no metrics container port by default
    template: templates/controller/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].ports

  - it: declares the metrics container port when metrics are enabled
    template: templates/controller/deployment.yaml
    set:
      controller.metrics.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 9090
            name: http-metrics
            protocol: TCP

  # The id label stays on the pod selector only: a Deployment selector is
  # immutable, so dropping it there would break upgrades of suffixed controllers.
  - it: carries the controller id only on the pod selector
    template: templates/controller/deployment.yaml
    set:
      controller.id: east
    asserts:
      - notExists:
          path: metadata.labels["akuity.io/kargo-controller-id"]
      - equal:
          path: spec.selector.matchLabels["akuity.io/kargo-controller-id"]
          value: east
      - equal:
          path: spec.template.metadata.labels["akuity.io/kargo-controller-id"]
          value: east

---
suite: controller/configmap.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/controller/configmap.yaml
tests:
  - it: marks the controller as default when no shard name is set
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.IS_DEFAULT_CONTROLLER
          value: "true"
      - notExists:
          path: data.SHARD_NAME

  - it: sets the shard name and is not default when a shard is named
    set:
      controller.shardName: shard-a
    asserts:
      - equal:
          path: data.SHARD_NAME
          value: shard-a
      - notExists:
          path: data.IS_DEFAULT_CONTROLLER

  - it: is both sharded and default when isDefault is set with a shard name
    set:
      controller.shardName: shard-a
      controller.isDefault: true
    asserts:
      - equal:
          path: data.SHARD_NAME
          value: shard-a
      - equal:
          path: data.IS_DEFAULT_CONTROLLER
          value: "true"

  - it: includes the API server base URL when the API is enabled
    asserts:
      - equal:
          path: data.API_SERVER_BASE_URL
          value: https://localhost

  - it: omits the API server base URL when the API is disabled
    set:
      api.enabled: false
    asserts:
      - notExists:
          path: data.API_SERVER_BASE_URL

  - it: reaches the API server through its Service, trusting the chart's certificate
    asserts:
      - equal:
          path: data.API_SERVER_ADDRESS
          value: https://kargo-api.NAMESPACE.svc
      - equal:
          path: data.API_SERVER_CA_CERT_PATH
          value: /etc/kargo/api-ca.crt

  - it: reaches the API server over plain HTTP when it serves none
    set:
      api.tls.enabled: false
    asserts:
      - equal:
          path: data.API_SERVER_ADDRESS
          value: http://kargo-api.NAMESPACE.svc
      - notExists:
          path: data.API_SERVER_CA_CERT_PATH

  - it: does not supply a CA for a certificate the chart did not generate
    set:
      api.tls.selfSignedCert: false
    asserts:
      - equal:
          path: data.API_SERVER_ADDRESS
          value: https://kargo-api.NAMESPACE.svc
      - notExists:
          path: data.API_SERVER_CA_CERT_PATH

  - it: reaches the API server at the configured address
    set:
      controller.apiServer.address: https://kargo.example.com
    asserts:
      - equal:
          path: data.API_SERVER_ADDRESS
          value: https://kargo.example.com
      - notExists:
          path: data.API_SERVER_CA_CERT_PATH

  - it: has no API server address when the API is disabled
    set:
      api.enabled: false
    asserts:
      - notExists:
          path: data.API_SERVER_ADDRESS
      - notExists:
          path: data.API_SERVER_CA_CERT_PATH

  - it: omits METRICS_BIND_ADDRESS by default
    asserts:
      - notExists:
          path: data.METRICS_BIND_ADDRESS

  - it: sets METRICS_BIND_ADDRESS when metrics are enabled
    set:
      controller.metrics.enabled: true
      controller.metrics.service.servicePort: 9095
    asserts:
      - equal:
          path: data.METRICS_BIND_ADDRESS
          value: ":9095"

  - it: configures PromotionRequest reconciliation concurrency
    set:
      controller.reconcilers.promotionRequests.maxConcurrentReconciles: 7
    asserts:
      - equal:
          path: data.MAX_CONCURRENT_PROMOTION_REQUEST_RECONCILES
          value: "7"

---
suite: controller/cluster-role-bindings.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/controller/cluster-role-bindings.yaml
tests:
  - it: binds the controller and its integration roles by default
    asserts:
      - documentSelector:
          path: metadata.name
          value: kargo-controller
        equal:
          path: roleRef.name
          value: kargo-controller
      - documentSelector:
          path: metadata.name
          value: kargo-controller-rollouts
        isKind:
          of: ClusterRoleBinding

  - it: drops the rollouts binding when rollouts integration is disabled
    set:
      controller.rollouts.integrationEnabled: false
      controller.argocd.integrationEnabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: kargo-controller

  - it: is not rendered when cluster role bindings are disabled
    set:
      rbac.installClusterRoleBindings: false
      argocd.dataPlane.install: false
    asserts:
      - hasDocuments:
          count: 0

---
suite: controller/metrics-service.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/controller/metrics-service.yaml
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the metrics Service when metrics are enabled
    set:
      controller.metrics.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: kargo-controller-metrics
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 9090
      - equal:
          path: spec.ports[0].targetPort
          value: 9090
      - equal:
          path: spec.ports[0].name
          value: http-metrics
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: controller
      - notExists:
          path: spec.clusterIP

  - it: supports a headless Service and custom port
    set:
      controller.metrics.enabled: true
      controller.metrics.service.clusterIP: None
      controller.metrics.service.servicePort: 9095
      controller.metrics.service.portName: telemetry
    asserts:
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.ports[0].port
          value: 9095
      - equal:
          path: spec.ports[0].name
          value: telemetry

---
suite: controller/metrics-service-monitor.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/controller/metrics-service-monitor.yaml
tests:
  - it: is not rendered by default
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1
    asserts:
      - hasDocuments:
          count: 0

  - it: is not rendered when only metrics are enabled
    set:
      controller.metrics.enabled: true
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1
    asserts:
      - hasDocuments:
          count: 0

  - it: is not rendered when the Prometheus Operator CRDs are absent
    set:
      controller.metrics.enabled: true
      controller.metrics.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the ServiceMonitor when enabled and the CRDs are present
    set:
      controller.metrics.enabled: true
      controller.metrics.serviceMonitor.enabled: true
      controller.metrics.serviceMonitor.interval: 15s
      controller.metrics.serviceMonitor.additionalLabels:
        release: prometheus
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceMonitor
      - equal:
          path: metadata.name
          value: kargo-controller-metrics
      - equal:
          path: metadata.labels.release
          value: prometheus
      - equal:
          path: spec.endpoints[0].port
          value: http-metrics
      - equal:
          path: spec.endpoints[0].path
          value: /metrics
      - equal:
          path: spec.endpoints[0].interval
          value: 15s
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: controller

  # The metrics Service no longer carries the id label, and a ServiceMonitor
  # selects Services by label, so the selector must not ask for it.
  - it: does not select on the controller id
    set:
      controller.id: east
      controller.metrics.enabled: true
      controller.metrics.serviceMonitor.enabled: true
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1
    asserts:
      - equal:
          path: metadata.name
          value: kargo-controller-east-metrics
      - notExists:
          path: spec.selector.matchLabels["akuity.io/kargo-controller-id"]

---
suite: controller/cluster-roles.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/controller/cluster-roles.yaml
tests:
  # The Stage controller is the only thing that creates PromotionRequests, so the
  # controller needs create alongside the read verbs.
  - it: grants PromotionRequest create access
    documentSelector:
      path: metadata.name
      value: kargo-controller
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - kargo.akuity.io
            resources:
              - promotions
              - promotionrequests
            verbs:
              - create
              - get
              - list
              - watch

  - it: grants read-only access to configuration and Projects
    documentSelector:
      path: metadata.name
      value: kargo-controller
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - kargo.akuity.io
            resources:
              - clusterconfigs
              - projects
              - projectconfigs
            verbs:
              - get
              - list
              - watch

  - it: grants get and list on Targets, which the API server authorizes it against
    documentSelector:
      path: metadata.name
      value: kargo-controller
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - kargo.akuity.io
            resources:
              - targets
            verbs:
              - get
              - list

  - it: grants PromotionRequest status patch access
    documentSelector:
      path: metadata.name
      value: kargo-controller
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - kargo.akuity.io
            resources:
              - freights/status
              - promotions/status
              - promotionrequests/status
              - stages/status
              - warehouses/finalizers
              - warehouses/status
            verbs:
              - patch

  # The id already lives in the name. As a label it is capped at 63 bytes and
  # a long id made the apply fail.
  - it: does not carry the controller id as a label
    set:
      controller.id: east
    documentSelector:
      path: metadata.name
      value: kargo-controller-east-argocd
    asserts:
      - notExists:
          path: metadata.labels["akuity.io/kargo-controller-id"]

---
suite: controller/roles.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/controller/roles.yaml
tests:
  # The shared Role is bound to every controller's ServiceAccount, so it must
  # hold nothing that names one controller.
  - it: grants no token access from the shared Role
    documentSelector:
      path: metadata.name
      value: kargo-controller
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - serviceaccounts/token
          any: true

---
suite: controller/token-requester-role.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/controller/token-requester-role.yaml
tests:
  # The controller acts as its own ServiceAccount toward the API server, with
  # tokens it requests for it, so it may create that ServiceAccount's tokens
  # and no other's.
  - it: lets the controller request tokens for its own ServiceAccount
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.name
          value: kargo-controller-token-requester
      - equal:
          path: rules
          value:
            - apiGroups:
                - ""
              resources:
                - serviceaccounts/token
              resourceNames:
                - kargo-controller
              verbs:
                - create

  # Each controller is its own Helm release in the control plane's namespace,
  # so the Role is named for the controller and grants its ServiceAccount only.
  - it: is a Role of the shard's own
    set:
      controller.id: east
    asserts:
      - equal:
          path: metadata.name
          value: kargo-controller-east-token-requester
      - equal:
          path: rules[0].resourceNames
          value:
            - kargo-controller-east

  - it: is not rendered when the controller is disabled
    set:
      controller.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: is not rendered when the controller is not installed in the data plane
    set:
      dataPlane.controller.install: false
    asserts:
      - hasDocuments:
          count: 0

---
suite: controller/token-requester-role-binding.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/controller/token-requester-role-binding.yaml
tests:
  - it: binds the controller's ServiceAccount to its token-requester Role
    set:
      controller.id: east
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: metadata.name
          value: kargo-controller-east-token-requester
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: kargo-controller-east-token-requester
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              namespace: NAMESPACE
              name: kargo-controller-east

  - it: is not rendered when the controller is disabled
    set:
      controller.enabled: false
    asserts:
      - hasDocuments:
          count: 0
