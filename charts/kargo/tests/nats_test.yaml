suite: api (NATS)
values:
  - ../test/values-unittest.yaml
release:
  namespace: kargo
templates:
  - templates/api/deployment.yaml
  - templates/api/configmap.yaml
  - templates/api/secret.yaml
tests:
  - it: connects to the NATS installed by the chart by default
    template: templates/api/configmap.yaml
    asserts:
      - equal:
          path: data.NATS_SERVER_URL
          value: nats://kargo-nats.kargo.svc.cluster.local:4222
      - notExists:
          path: data.NATS_SEED_KEY_FILE

  - it: names its NATS connection after the pod
    template: templates/api/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NATS_CLIENT_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name

  - it: ignores the external nkey seed Secret when NATS is installed by the chart
    set:
      nats.external.nkeySeedSecret.name: nats-nkey-seed
    asserts:
      - notExists:
          path: data.NATS_SEED_KEY_FILE
        template: templates/api/configmap.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: nats-nkey
          any: true
        template: templates/api/deployment.yaml

  - it: connects to an external NATS server with an nkey seed
    set:
      nats.enabled: false
      nats.external.url: nats://nats.example.com:4222
      nats.external.nkeySeedSecret.name: nats-nkey-seed
      nats.external.nkeySeedSecret.key: my-seed
    asserts:
      - equal:
          path: data.NATS_SERVER_URL
          value: nats://nats.example.com:4222
        template: templates/api/configmap.yaml
      - equal:
          path: data.NATS_SEED_KEY_FILE
          value: /etc/kargo/nats/seed.nk
        template: templates/api/configmap.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /etc/kargo/nats
            name: nats-nkey
            readOnly: true
        template: templates/api/deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nats-nkey
            secret:
              secretName: nats-nkey-seed
              items:
              - key: my-seed
                path: seed.nk
        template: templates/api/deployment.yaml

  - it: fails when NATS is disabled and no external URL is set
    template: templates/api/deployment.yaml
    set:
      nats.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: nats\.external\.url must be set when nats\.enabled is false

