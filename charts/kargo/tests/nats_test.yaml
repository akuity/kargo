suite: _helpers.tpl/kargo.nats.*
# The NATS helpers render identically for every component that includes them,
# so their behavior is tested once, against the API server. The suites that
# follow check only that each component includes them.
values:
  - ../test/values-unittest.yaml
release:
  namespace: kargo
templates:
  - templates/api/deployment.yaml
  - templates/api/configmap.yaml
  - templates/api/secret.yaml
tests:
  - it: ignores external NATS settings when NATS is installed by the chart
    set:
      nats.external.nkeySeedSecret.name: nats-nkey-seed
      nats.external.credsSecret.name: nats-creds
      nats.external.tokenSecret.name: nats-token
      nats.external.userPasswordSecret.name: nats-user
      nats.external.tls.caSecret.name: nats-ca
      nats.external.tls.clientCertSecret.name: nats-client-cert
    asserts:
      - equal:
          path: data.NATS_SERVER_URL
          value: nats://kargo-nats.kargo.svc.cluster.local:4222
        template: templates/api/configmap.yaml
      - notExists:
          path: data.NATS_SEED_KEY_FILE
        template: templates/api/configmap.yaml
      - notExists:
          path: data.NATS_CREDS_FILE
        template: templates/api/configmap.yaml
      - notExists:
          path: data.NATS_TLS_CA_FILE
        template: templates/api/configmap.yaml
      - notExists:
          path: data.NATS_TLS_CERT_FILE
        template: templates/api/configmap.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NATS_TOKEN
          any: true
        template: templates/api/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NATS_USERNAME
          any: true
        template: templates/api/deployment.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: nats
          any: true
        template: templates/api/deployment.yaml

  - it: mounts an nkey seed
    set:
      nats.enabled: false
      nats.external.url: nats://nats.example.com:4222
      nats.external.nkeySeedSecret.name: nats-nkey-seed
      nats.external.nkeySeedSecret.key: my-seed
    asserts:
      - equal:
          path: data.NATS_SEED_KEY_FILE
          value: /etc/kargo/nats/seed.nk
        template: templates/api/configmap.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nats
            projected:
              sources:
              - secret:
                  name: nats-nkey-seed
                  items:
                  - key: my-seed
                    path: seed.nk
        template: templates/api/deployment.yaml

  - it: mounts a creds file
    set:
      nats.enabled: false
      nats.external.url: nats://nats.example.com:4222
      nats.external.credsSecret.name: nats-creds
      nats.external.credsSecret.key: kargo.creds
    asserts:
      - equal:
          path: data.NATS_CREDS_FILE
          value: /etc/kargo/nats/user.creds
        template: templates/api/configmap.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nats
            projected:
              sources:
              - secret:
                  name: nats-creds
                  items:
                  - key: kargo.creds
                    path: user.creds
        template: templates/api/deployment.yaml

  - it: mounts TLS material alongside other credentials
    set:
      nats.enabled: false
      nats.external.url: tls://nats.example.com:4222
      nats.external.credsSecret.name: nats-creds
      nats.external.tls.caSecret.name: nats-tls
      nats.external.tls.clientCertSecret.name: nats-tls
    asserts:
      - equal:
          path: data.NATS_TLS_CA_FILE
          value: /etc/kargo/nats/ca.crt
        template: templates/api/configmap.yaml
      - equal:
          path: data.NATS_TLS_CERT_FILE
          value: /etc/kargo/nats/tls.crt
        template: templates/api/configmap.yaml
      - equal:
          path: data.NATS_TLS_KEY_FILE
          value: /etc/kargo/nats/tls.key
        template: templates/api/configmap.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nats
            projected:
              sources:
              - secret:
                  name: nats-creds
                  items:
                  - key: user.creds
                    path: user.creds
              - secret:
                  name: nats-tls
                  items:
                  - key: ca.crt
                    path: ca.crt
              - secret:
                  name: nats-tls
                  items:
                  - key: tls.crt
                    path: tls.crt
              - secret:
                  name: nats-tls
                  items:
                  - key: tls.key
                    path: tls.key
        template: templates/api/deployment.yaml

  - it: passes a token through the environment without mounting anything
    template: templates/api/deployment.yaml
    set:
      nats.enabled: false
      nats.external.url: nats://nats.example.com:4222
      nats.external.tokenSecret.name: nats-token
      nats.external.tokenSecret.key: my-token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NATS_TOKEN
            valueFrom:
              secretKeyRef:
                name: nats-token
                key: my-token
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: nats
          any: true

  - it: passes a username and password through the environment
    template: templates/api/deployment.yaml
    set:
      nats.enabled: false
      nats.external.url: nats://nats.example.com:4222
      nats.external.userPasswordSecret.name: nats-user
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NATS_USERNAME
            valueFrom:
              secretKeyRef:
                name: nats-user
                key: username
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NATS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: nats-user
                key: password

  - it: fails when more than one kind of external NATS credentials is set
    template: templates/api/deployment.yaml
    set:
      nats.enabled: false
      nats.external.url: nats://nats.example.com:4222
      nats.external.nkeySeedSecret.name: nats-nkey-seed
      nats.external.credsSecret.name: nats-creds
    asserts:
      - failedTemplate:
          errorPattern: nats\.external\.nkeySeedSecret\.name, nats\.external\.credsSecret\.name are all set

  - it: fails when NATS is disabled and no external URL is set
    template: templates/api/deployment.yaml
    set:
      nats.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: nats\.external\.url must be set when nats\.enabled is false

---
suite: api (NATS)
values:
  - ../test/values-unittest.yaml
release:
  namespace: kargo
templates:
  - templates/api/deployment.yaml
  - templates/api/configmap.yaml
  - templates/api/secret.yaml
tests:
  - it: connects to the NATS installed by the chart by default
    asserts:
      - equal:
          path: data.NATS_SERVER_URL
          value: nats://kargo-nats.kargo.svc.cluster.local:4222
        template: templates/api/configmap.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NATS_CLIENT_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
        template: templates/api/deployment.yaml

  - it: mounts files for connecting to an external NATS server
    set:
      nats.enabled: false
      nats.external.url: tls://nats.example.com:4222
      nats.external.credsSecret.name: nats-creds
      nats.external.tls.caSecret.name: nats-ca
    asserts:
      - equal:
          path: data.NATS_SERVER_URL
          value: tls://nats.example.com:4222
        template: templates/api/configmap.yaml
      - equal:
          path: data.NATS_CREDS_FILE
          value: /etc/kargo/nats/user.creds
        template: templates/api/configmap.yaml
      - equal:
          path: data.NATS_TLS_CA_FILE
          value: /etc/kargo/nats/ca.crt
        template: templates/api/configmap.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /etc/kargo/nats
            name: nats
            readOnly: true
        template: templates/api/deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nats
            projected:
              sources:
              - secret:
                  name: nats-creds
                  items:
                  - key: user.creds
                    path: user.creds
              - secret:
                  name: nats-ca
                  items:
                  - key: ca.crt
                    path: ca.crt
        template: templates/api/deployment.yaml

