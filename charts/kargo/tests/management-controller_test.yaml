suite: management-controller/deployment.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/management-controller/deployment.yaml
  - templates/management-controller/configmap.yaml
tests:
  - it: renders the management controller Deployment by default
    template: templates/management-controller/deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: kargo-management-controller
      - equal:
          path: spec.template.spec.serviceAccountName
          value: kargo-management-controller

  - it: is not rendered when the management controller is disabled
    template: templates/management-controller/deployment.yaml
    set:
      managementController.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: declares no metrics container port by default
    template: templates/management-controller/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].ports

  - it: declares the metrics container port when metrics are enabled
    template: templates/management-controller/deployment.yaml
    set:
      managementController.metrics.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 9090
            name: http-metrics
            protocol: TCP

  - it: points at the bundled PostgreSQL by default
    template: templates/management-controller/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_HOST
            value: kargo-postgres.NAMESPACE.svc
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: kargo-postgres
                key: password
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
          any: true

  - it: reads the bundled PostgreSQL password from an existing Secret
    template: templates/management-controller/deployment.yaml
    set:
      database.postgres.existingSecret: my-postgres
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-postgres
                key: password

  - it: reads an external database connection string from its Secret
    template: templates/management-controller/deployment.yaml
    set:
      database.postgres.enabled: false
      database.external.secretName: my-database
      database.external.secretKey: url
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: my-database
                key: url
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_HOST
          any: true

  - it: sets no database environment when no database is configured
    template: templates/management-controller/deployment.yaml
    set:
      database.postgres.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_HOST
          any: true

  - it: mounts the chart-generated API server CA
    template: templates/management-controller/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /etc/kargo/api-ca.crt
            name: api-ca
            subPath: ca.crt
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: api-ca
            secret:
              secretName: kargo-api-cert
              items:
              - key: ca.crt
                path: ca.crt

  - it: mounts no API server CA when the API server serves plain HTTP
    template: templates/management-controller/deployment.yaml
    set:
      api.tls.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: api-ca
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: api-ca
          any: true

  - it: mounts no API server CA when the management controller is pointed elsewhere
    template: templates/management-controller/deployment.yaml
    set:
      managementController.apiServer.address: https://kargo.example.com
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: api-ca
          any: true

---
suite: management-controller/configmap.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/management-controller/configmap.yaml
tests:
  - it: renders management controller configuration with defaults
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.LOG_LEVEL
          value: INFO
      - equal:
          path: data.SYSTEM_RESOURCES_NAMESPACE
          value: kargo-system-resources
      - equal:
          path: data.SHARED_RESOURCES_NAMESPACE
          value: kargo-shared-resources
      - equal:
          path: data.MAX_CONCURRENT_PROJECT_RECONCILES
          value: "4"

  - it: derives the external webhooks server base URL (https by default)
    asserts:
      - equal:
          path: data.EXTERNAL_WEBHOOK_SERVER_BASE_URL
          value: https://localhost

  - it: stops managing controller role bindings when cluster-wide secret reading is enabled
    set:
      controller.serviceAccount.clusterWideSecretReadingEnabled: true
    asserts:
      - equal:
          path: data.MANAGE_CONTROLLER_ROLE_BINDINGS
          value: "false"

  - it: omits METRICS_BIND_ADDRESS by default
    asserts:
      - notExists:
          path: data.METRICS_BIND_ADDRESS

  - it: sets METRICS_BIND_ADDRESS when metrics are enabled
    set:
      managementController.metrics.enabled: true
    asserts:
      - equal:
          path: data.METRICS_BIND_ADDRESS
          value: ":9090"

  - it: reaches the API server through its Service, trusting the chart's certificate
    asserts:
      - equal:
          path: data.API_SERVER_ADDRESS
          value: https://kargo-api.NAMESPACE.svc
      - equal:
          path: data.API_SERVER_CA_CERT_PATH
          value: /etc/kargo/api-ca.crt

  - it: reaches the API server over plain HTTP when it serves none
    set:
      api.tls.enabled: false
    asserts:
      - equal:
          path: data.API_SERVER_ADDRESS
          value: http://kargo-api.NAMESPACE.svc
      - notExists:
          path: data.API_SERVER_CA_CERT_PATH

  - it: does not supply a CA for a certificate the chart did not generate
    set:
      api.tls.selfSignedCert: false
    asserts:
      - equal:
          path: data.API_SERVER_ADDRESS
          value: https://kargo-api.NAMESPACE.svc
      - notExists:
          path: data.API_SERVER_CA_CERT_PATH

  - it: reaches the API server at the configured address
    set:
      managementController.apiServer.address: https://kargo.example.com
    asserts:
      - equal:
          path: data.API_SERVER_ADDRESS
          value: https://kargo.example.com
      - notExists:
          path: data.API_SERVER_CA_CERT_PATH

  - it: has no API server address when the API is disabled
    set:
      api.enabled: false
    asserts:
      - notExists:
          path: data.API_SERVER_ADDRESS
      - notExists:
          path: data.API_SERVER_CA_CERT_PATH

---
suite: management-controller/metrics-service.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/management-controller/metrics-service.yaml
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the metrics Service when metrics are enabled
    set:
      managementController.metrics.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: kargo-management-controller-metrics
      - equal:
          path: spec.ports[0].port
          value: 9090
      - equal:
          path: spec.ports[0].name
          value: http-metrics
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: management-controller

---
suite: management-controller/metrics-service-monitor.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/management-controller/metrics-service-monitor.yaml
tests:
  - it: is not rendered when the Prometheus Operator CRDs are absent
    set:
      managementController.metrics.enabled: true
      managementController.metrics.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the ServiceMonitor when enabled and the CRDs are present
    set:
      managementController.metrics.enabled: true
      managementController.metrics.serviceMonitor.enabled: true
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceMonitor
      - equal:
          path: metadata.name
          value: kargo-management-controller-metrics
      - equal:
          path: spec.endpoints[0].port
          value: http-metrics
      - equal:
          path: spec.endpoints[0].path
          value: /metrics
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: management-controller

---
suite: management-controller/token-requester-role.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/management-controller/token-requester-role.yaml
tests:
  # The management controller acts as its own ServiceAccount toward the API
  # server, with tokens it requests for it, so it may create that
  # ServiceAccount's tokens and no other's.
  - it: lets the management controller request tokens for its own ServiceAccount
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.name
          value: kargo-management-controller-token-requester
      - equal:
          path: rules
          value:
            - apiGroups:
                - ""
              resources:
                - serviceaccounts/token
              resourceNames:
                - kargo-management-controller
              verbs:
                - create

  - it: is not rendered when the management controller is disabled
    set:
      managementController.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: is not rendered when the data plane is not installed
    set:
      dataPlane.install: false
    asserts:
      - hasDocuments:
          count: 0

---
suite: management-controller/token-requester-role-binding.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/management-controller/token-requester-role-binding.yaml
tests:
  - it: binds the management controller's ServiceAccount to its token-requester Role
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: metadata.name
          value: kargo-management-controller-token-requester
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: kargo-management-controller-token-requester
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              namespace: NAMESPACE
              name: kargo-management-controller

  - it: is not rendered when the management controller is disabled
    set:
      managementController.enabled: false
    asserts:
      - hasDocuments:
          count: 0

---
suite: management-controller/cluster-roles.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/management-controller/cluster-roles.yaml
tests:
  # ProjectConfig status is written through the API server, which checks that
  # the management controller may update it.
  - it: lets the management controller update ProjectConfig status
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - kargo.akuity.io
            resources:
              - projectconfigs/status
            verbs:
              - update

  - it: does not let the management controller create ProjectConfigs
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - kargo.akuity.io
            resources:
              - projectconfigs
            verbs:
              - create

  # ProjectConfigs live in the database, which the management controller
  # reads directly; it never reads or patches ProjectConfig resources.
  - it: does not let the management controller read ProjectConfig resources
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - kargo.akuity.io
            resources:
              - clusterconfigs
              - promotionrequests
              - promotions
              - stages
              - warehouses
            verbs:
              - get
              - list
              - watch
  - it: does not let the management controller patch ProjectConfig status
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - kargo.akuity.io
            resources:
              - clusterconfigs/status
              - projects/status
            verbs:
              - patch
