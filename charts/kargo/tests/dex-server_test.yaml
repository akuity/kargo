suite: dex-server/service.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/dex-server/service.yaml
tests:
  - it: is not rendered when Dex is disabled (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the Dex Service when OIDC + Dex are enabled
    set:
      api.oidc.enabled: true
      api.oidc.dex.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: kargo-dex-server
      - equal:
          path: spec.ports[0].port
          value: 443
      - equal:
          path: spec.ports[0].targetPort
          value: 5556

---
suite: dex-server/deployment.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/dex-server/deployment.yaml
  - templates/dex-server/secret.yaml
tests:
  - it: is not rendered when Dex is disabled (default)
    template: templates/dex-server/deployment.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the Dex Deployment when OIDC + Dex are enabled
    template: templates/dex-server/deployment.yaml
    set:
      api.oidc.enabled: true
      api.oidc.dex.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: kargo-dex-server

  - it: does not mount a service account token in the pod by default
    template: templates/dex-server/deployment.yaml
    set:
      api.oidc.enabled: true
      api.oidc.dex.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: mounts a service account token in the pod when api.oidc.dex.automountServiceAccountToken is true
    template: templates/dex-server/deployment.yaml
    set:
      api.oidc.enabled: true
      api.oidc.dex.enabled: true
      api.oidc.dex.automountServiceAccountToken: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

---
suite: dex-server/secret.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/dex-server/secret.yaml
tests:
  - it: is not rendered when Dex is disabled (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the Dex config Secret when OIDC + Dex are enabled
    set:
      api.oidc.enabled: true
      api.oidc.dex.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: kargo-dex-server

---
suite: dex-server/service-account.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/dex-server/service-account.yaml
tests:
  - it: is not rendered when Dex is disabled (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: disables token automounting on the ServiceAccount by default
    set:
      api.oidc.enabled: true
      api.oidc.dex.enabled: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: enables token automounting on the ServiceAccount when api.oidc.dex.serviceAccount.automountServiceAccountToken is true
    set:
      api.oidc.enabled: true
      api.oidc.dex.enabled: true
      api.oidc.dex.serviceAccount.automountServiceAccountToken: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true
