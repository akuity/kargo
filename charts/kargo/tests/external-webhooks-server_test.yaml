suite: external-webhooks-server/deployment.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/external-webhooks-server/deployment.yaml
  - templates/external-webhooks-server/configmap.yaml
tests:
  - it: renders the external webhooks server Deployment by default
    template: templates/external-webhooks-server/deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: kargo-external-webhooks-server
      - equal:
          path: spec.template.spec.serviceAccountName
          value: kargo-external-webhooks-server

  - it: is not rendered when the external webhooks server is disabled
    template: templates/external-webhooks-server/deployment.yaml
    set:
      externalWebhooksServer.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: declares only the webhooks port by default
    template: templates/external-webhooks-server/deployment.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 1

  - it: appends the metrics container port when metrics are enabled
    template: templates/external-webhooks-server/deployment.yaml
    set:
      externalWebhooksServer.metrics.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 9090
            name: http-metrics
            protocol: TCP

---
suite: external-webhooks-server/configmap.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/external-webhooks-server/configmap.yaml
tests:
  - it: renders configuration with defaults
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.LOG_LEVEL
          value: INFO
      - equal:
          path: data.SYSTEM_RESOURCES_NAMESPACE
          value: kargo-system-resources
      - equal:
          path: data.TLS_ENABLED
          value: "true"

  - it: derives the external webhooks server base URL (https by default)
    asserts:
      - equal:
          path: data.EXTERNAL_WEBHOOK_SERVER_BASE_URL
          value: https://localhost

  - it: omits TLS env when direct TLS is disabled
    set:
      externalWebhooksServer.tls.enabled: false
    asserts:
      - notExists:
          path: data.TLS_ENABLED

  - it: omits METRICS_BIND_ADDRESS by default
    asserts:
      - notExists:
          path: data.METRICS_BIND_ADDRESS

  - it: sets METRICS_BIND_ADDRESS when metrics are enabled
    set:
      externalWebhooksServer.metrics.enabled: true
    asserts:
      - equal:
          path: data.METRICS_BIND_ADDRESS
          value: ":9090"

---
suite: external-webhooks-server/service.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/external-webhooks-server/service.yaml
tests:
  - it: renders the external webhooks Service
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: kargo-external-webhooks-server

---
suite: external-webhooks-server/metrics-service.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/external-webhooks-server/metrics-service.yaml
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the metrics Service when metrics are enabled
    set:
      externalWebhooksServer.metrics.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: kargo-external-webhooks-server-metrics
      - equal:
          path: spec.ports[0].port
          value: 9090
      - equal:
          path: spec.ports[0].name
          value: http-metrics
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: external-webhooks-server

---
suite: external-webhooks-server/metrics-service-monitor.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/external-webhooks-server/metrics-service-monitor.yaml
tests:
  - it: is not rendered when the Prometheus Operator CRDs are absent
    set:
      externalWebhooksServer.metrics.enabled: true
      externalWebhooksServer.metrics.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the ServiceMonitor when enabled and the CRDs are present
    set:
      externalWebhooksServer.metrics.enabled: true
      externalWebhooksServer.metrics.serviceMonitor.enabled: true
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceMonitor
      - equal:
          path: metadata.name
          value: kargo-external-webhooks-server-metrics
      - equal:
          path: spec.endpoints[0].port
          value: http-metrics
      - equal:
          path: spec.endpoints[0].path
          value: /metrics
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: external-webhooks-server
