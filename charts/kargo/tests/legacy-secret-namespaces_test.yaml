suite: _helpers.tpl/kargo.validateNoLegacySecretNamespaces (controller)
values:
  - ../test/values-unittest.yaml
templates:
  - templates/controller/configmap.yaml
tests:
  - it: does not fail by default
    asserts:
      - notFailedTemplate: {}

  - it: fails when global.clusterSecretsNamespace is set
    set:
      global.clusterSecretsNamespace: kargo-cluster-secrets
    asserts:
      - failedTemplate:
          errorPattern: global\.clusterSecretsNamespace is no longer supported

  - it: does not fail when global.clusterSecretsNamespace is an empty string
    set:
      global.clusterSecretsNamespace: ""
    asserts:
      - notFailedTemplate: {}

  - it: does not fail when misconfigured but the controller is disabled
    set:
      global.clusterSecretsNamespace: kargo-cluster-secrets
      workloads.install: false
    asserts:
      - notFailedTemplate: {}

  - it: fails when controller.globalCredentials.namespaces is set
    set:
      controller.globalCredentials.namespaces:
        - kargo-cluster-secrets
    asserts:
      - failedTemplate:
          errorPattern: controller\.globalCredentials\.namespaces is no longer supported

  - it: does not fail when controller.globalCredentials.namespaces is an empty list
    set:
      controller.globalCredentials.namespaces: []
    asserts:
      - notFailedTemplate: {}

