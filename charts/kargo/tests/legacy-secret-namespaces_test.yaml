suite: _helpers.tpl/kargo.validateNoLegacySecretNamespaces
values:
  - ../test/values-unittest.yaml
templates:
  - templates/NOTES.txt
tests:
  - it: does not fail by default
    asserts:
      - notFailedTemplate: {}

  - it: fails when global.clusterSecretsNamespace is set
    set:
      global.clusterSecretsNamespace: kargo-cluster-secrets
    asserts:
      - failedTemplate:
          errorMessage: global.clusterSecretsNamespace is no longer supported as of v1.12.0. Secrets have already been migrated to global.systemResources.namespace; remove this setting from your values.

  - it: does not fail when global.clusterSecretsNamespace is an empty string
    set:
      global.clusterSecretsNamespace: ""
    asserts:
      - notFailedTemplate: {}

  - it: fails when controller.globalCredentials.namespaces is set
    set:
      controller.globalCredentials.namespaces:
        - kargo-cluster-secrets
    asserts:
      - failedTemplate:
          errorMessage: controller.globalCredentials.namespaces is no longer supported as of v1.12.0. Secrets have already been migrated to global.sharedResources.namespace; remove this setting from your values.

  - it: does not fail when controller.globalCredentials.namespaces is an empty list
    set:
      controller.globalCredentials.namespaces: []
    asserts:
      - notFailedTemplate: {}
