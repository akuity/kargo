# The chart version lives in helm.sh/chart. Inside a pod template it feeds
# pod-template-hash, so every workload rolls on a chart upgrade that changed
# nothing else. It belongs on the objects, not on the pods.
suite: pod labels exclude the chart version
values:
  - ../test/values-unittest.yaml
templates:
  - templates/api/deployment.yaml
  - templates/controller/deployment.yaml
  - templates/management-controller/deployment.yaml
  - templates/kubernetes-webhooks-server/deployment.yaml
  - templates/external-webhooks-server/deployment.yaml
  - templates/dex-server/deployment.yaml
  - templates/postgres/statefulset.yaml
  - templates/garbage-collector/cron-job.yaml
  # Referenced by the workloads above for their checksum annotations, so they
  # have to be part of the suite.
  - templates/api/configmap.yaml
  - templates/api/secret.yaml
  - templates/controller/configmap.yaml
  - templates/dex-server/secret.yaml
  - templates/external-webhooks-server/configmap.yaml
  - templates/garbage-collector/configmap.yaml
  - templates/kubernetes-webhooks-server/configmap.yaml
  - templates/management-controller/configmap.yaml
  - templates/postgres/secret.yaml
tests:
  - it: should not put the chart version in any Deployment pod template
    templates:
      - templates/api/deployment.yaml
      - templates/controller/deployment.yaml
      - templates/management-controller/deployment.yaml
      - templates/kubernetes-webhooks-server/deployment.yaml
      - templates/external-webhooks-server/deployment.yaml
      - templates/dex-server/deployment.yaml
    set:
      api.enabled: true
      externalWebhooksServer.enabled: true
      api.oidc.enabled: true
      api.oidc.dex.enabled: true
    asserts:
      - notExists:
          path: spec.template.metadata.labels["helm.sh/chart"]
      - exists:
          path: metadata.labels["helm.sh/chart"]

  - it: should not put the chart version in the postgres pod template
    template: templates/postgres/statefulset.yaml
    asserts:
      - notExists:
          path: spec.template.metadata.labels["helm.sh/chart"]
      - exists:
          path: metadata.labels["helm.sh/chart"]

  - it: should not put the chart version in the garbage-collector pod template
    template: templates/garbage-collector/cron-job.yaml
    asserts:
      - notExists:
          path: spec.jobTemplate.spec.template.metadata.labels["helm.sh/chart"]
      - exists:
          path: metadata.labels["helm.sh/chart"]

  - it: should keep the other common labels on the pod template
    template: templates/postgres/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: kargo
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: postgres

  - it: should keep global.labels on the pod template
    template: templates/postgres/statefulset.yaml
    set:
      global.labels:
        team: platform
    asserts:
      - equal:
          path: spec.template.metadata.labels.team
          value: platform
