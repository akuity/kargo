suite: api/deployment.yaml
values:
  - ../test/values-unittest.yaml
# configmap + secret are listed so the Deployment's checksum includes resolve;
# each test scopes assertions to the Deployment with template:.
templates:
  - templates/api/deployment.yaml
  - templates/api/configmap.yaml
  - templates/api/secret.yaml
tests:
  - it: renders the API Deployment by default
    template: templates/api/deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: kargo-api
      - equal:
          path: spec.template.spec.serviceAccountName
          value: kargo-api
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^.+/kargo:.+"
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: kargo-api
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].secretRef.name
          value: kargo-api

  - it: points at the bundled PostgreSQL by default
    template: templates/api/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_HOST
            value: kargo-postgres.NAMESPACE.svc
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: kargo-postgres
                key: password
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
          any: true

  - it: reads the bundled PostgreSQL password from an existing Secret
    template: templates/api/deployment.yaml
    set:
      database.postgres.existingSecret: my-postgres
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-postgres
                key: password

  - it: reads an external database connection string from its Secret
    template: templates/api/deployment.yaml
    set:
      database.postgres.enabled: false
      database.external.secretName: my-database
      database.external.secretKey: url
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: my-database
                key: url
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_HOST
          any: true

  - it: sets no database environment when no database is configured
    template: templates/api/deployment.yaml
    set:
      database.postgres.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_HOST
          any: true

  - it: is not rendered when the API is disabled
    template: templates/api/deployment.yaml
    set:
      api.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: is not rendered when workloads are not installed
    template: templates/api/deployment.yaml
    set:
      workloads.install: false
    asserts:
      - hasDocuments:
          count: 0

  - it: uses an HTTPS health probe when TLS is enabled (default)
    template: templates/api/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.scheme
          value: HTTPS
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.httpsGet

  - it: uses an HTTP health probe when TLS is disabled
    template: templates/api/deployment.yaml
    set:
      api.tls.enabled: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 8080
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.scheme
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.httpsGet

---
suite: api/configmap.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/api/configmap.yaml
tests:
  - it: renders API configuration with defaults
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.LOG_LEVEL
          value: INFO
      - equal:
          path: data.SECRET_MANAGEMENT_ENABLED
          value: "true"
      - equal:
          path: data.ROLLOUTS_INTEGRATION_ENABLED
          value: "true"
      - equal:
          path: data.ADMIN_ACCOUNT_ENABLED
          value: "true"

  - it: token issuer URL uses the https scheme when TLS is enabled (default)
    asserts:
      - equal:
          path: data.ADMIN_ACCOUNT_TOKEN_ISSUER
          value: https://localhost
      - equal:
          path: data.TLS_ENABLED
          value: "true"

  - it: token issuer URL uses the http scheme when TLS is disabled
    set:
      api.tls.enabled: false
    asserts:
      - equal:
          path: data.ADMIN_ACCOUNT_TOKEN_ISSUER
          value: http://localhost
      - notExists:
          path: data.TLS_ENABLED

  - it: omits secret management when disabled
    set:
      api.secretManagementEnabled: false
    asserts:
      - notExists:
          path: data.SECRET_MANAGEMENT_ENABLED

  - it: omits client IP and request log settings by default
    asserts:
      - notExists:
          path: data.TRUSTED_PROXIES
      - notExists:
          path: data.CLIENT_IP_HEADER
      - notExists:
          path: data.REQUEST_LOG_ALL_ENABLED
      - notExists:
          path: data.REQUEST_LOG_SOURCE_IP_ENABLED

  - it: configures trusted proxies and client IP header
    set:
      api.trustedProxies:
        - 10.0.0.0/8
        - 192.168.1.5
      api.clientIPHeader: CF-Connecting-IP
    asserts:
      - equal:
          path: data.TRUSTED_PROXIES
          value: 10.0.0.0/8,192.168.1.5
      - equal:
          path: data.CLIENT_IP_HEADER
          value: CF-Connecting-IP

  - it: enables request log settings
    set:
      api.requestLog.allEnabled: true
      api.requestLog.sourceIPEnabled: true
    asserts:
      - equal:
          path: data.REQUEST_LOG_ALL_ENABLED
          value: "true"
      - equal:
          path: data.REQUEST_LOG_SOURCE_IP_ENABLED
          value: "true"

  - it: enables OIDC config when OIDC is turned on
    set:
      api.oidc.enabled: true
      api.oidc.issuerURL: https://idp.example.com
      api.oidc.clientID: kargo
    asserts:
      - equal:
          path: data.OIDC_ENABLED
          value: "true"
      - equal:
          path: data.OIDC_ISSUER_URL
          value: https://idp.example.com

---
suite: api/secret.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/api/secret.yaml
tests:
  - it: renders the admin account secret by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData.ADMIN_ACCOUNT_PASSWORD_HASH
          value: "$2a$10$unittestunittestunittestunittestunittestunittestun"
      - isNotEmpty:
          path: stringData.ADMIN_ACCOUNT_TOKEN_SIGNING_KEY

  - it: is not rendered when an external secret name is provided
    set:
      api.secret.name: my-external-secret
    asserts:
      - hasDocuments:
          count: 0

---
suite: api/service.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/api/service.yaml
tests:
  - it: exposes port 443 over https by default (TLS enabled)
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.ports[0].port
          value: 443
      - equal:
          path: spec.ports[0].appProtocol
          value: https
      - equal:
          path: spec.ports[0].targetPort
          value: 8080

  - it: exposes port 80 over http when TLS is disabled
    set:
      api.tls.enabled: false
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].appProtocol
          value: http

---
suite: api/ingress.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/api/ingress.yaml
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an Ingress for the API host when enabled
    set:
      api.ingress.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress
      - equal:
          path: spec.rules[0].host
          value: localhost

  - it: routes /webhooks to the external webhooks server when it has no own ingress
    set:
      api.ingress.enabled: true
    asserts:
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /webhooks
      - equal:
          path: spec.rules[0].http.paths[1].backend.service.name
          value: kargo-external-webhooks-server

---
suite: api/cluster-roles.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/api/cluster-roles.yaml
tests:
  - it: grants full PromotionRequest access
    documentSelector:
      path: metadata.name
      value: kargo-api
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - kargo.akuity.io
            resources:
              - clusterconfigs
              - clusterpromotiontasks
              - projects
              - promotiontasks
              - stages
              - warehouses
              - projectconfigs
              - promotionrequests
              - targets
            verbs:
              - "*"
  - it: grants read access to RBAC resources
    documentSelector:
      path: metadata.name
      value: kargo-api
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - clusterrolebindings
              - clusterroles
              - rolebindings
              - roles
            verbs:
              - get
              - list
              - watch

---
suite: api/cert.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/api/cert.yaml
tests:
  - it: names the API server's host and its Service
    asserts:
      - isKind:
          of: Certificate
      - equal:
          path: spec.dnsNames
          value:
          - localhost
          - kargo-api.NAMESPACE.svc

  - it: is not rendered for a certificate the chart does not generate
    set:
      api.tls.selfSignedCert: false
    asserts:
      - hasDocuments:
          count: 0
