---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: promotionsets.kargo.akuity.io
spec:
  group: kargo.akuity.io
  names:
    kind: PromotionSet
    listKind: PromotionSetList
    plural: promotionsets
    shortNames:
    - promotionset
    - promotionsets
    singular: promotionset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.stage
      name: Stage
      type: string
    - jsonPath: .spec.freight
      name: Freight
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PromotionSet groups the Promotions that fan out a Stage's selected Freight
          to its selected Targets.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec describes the Stage and Freight associated with the
              PromotionSet.
            properties:
              freight:
                description: |-
                  Freight specifies the piece of Freight promoted by the Stage.
                  The Freight MUST be in the same namespace as the PromotionSet.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
                x-kubernetes-validations:
                - rule: self == oldSelf
              stage:
                description: |-
                  Stage specifies the name of the Stage that promotes the Freight.
                  The Stage MUST be in the same namespace as the PromotionSet.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
                x-kubernetes-validations:
                - rule: self == oldSelf
              targets:
                description: |-
                  Targets specifies the Targets to which this PromotionSet promotes Freight.
                  Each Target MUST be in the same namespace as the PromotionSet. The list
                  may be empty, which records that the governing Stage's target selectors
                  matched no Targets at the time the PromotionSet was created.

                  Target names MUST be unique. This is enforced by the PromotionSet
                  validating webhook rather than by the schema: the list is immutable, so
                  per-item ownership tracking would only inflate the object's managedFields
                  without ever being used to merge anything into it.
                items:
                  description: PromotionSetTarget identifies a Target selected by
                    a PromotionSet.
                  properties:
                    name:
                      description: Name is the name of the Target.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - rule: self == oldSelf
            required:
            - freight
            - stage
            - targets
            type: object
          status:
            description: |-
              Status describes the current aggregate state of the PromotionSet's
              Promotions.
            properties:
              conditions:
                description: |-
                  Conditions contains the last observations of the PromotionSet's current
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              finishedAt:
                description: FinishedAt is the time at which the PromotionSet completed.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the spec last
                  reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is a high-level summary of the PromotionSet's lifecycle.
                type: string
              startedAt:
                description: StartedAt is the time at which the PromotionSet started.
                format: date-time
                type: string
              summary:
                description: Summary aggregates the phases of this PromotionSet's
                  child Promotions.
                properties:
                  aborted:
                    description: Aborted is the number of child Promotions in the
                      Aborted phase.
                    format: int32
                    type: integer
                  errored:
                    description: Errored is the number of child Promotions in the
                      Errored phase.
                    format: int32
                    type: integer
                  failed:
                    description: Failed is the number of child Promotions in the Failed
                      phase.
                    format: int32
                    type: integer
                  pending:
                    description: Pending is the number of child Promotions in the
                      Pending phase.
                    format: int32
                    type: integer
                  running:
                    description: Running is the number of child Promotions in the
                      Running phase.
                    format: int32
                    type: integer
                  succeeded:
                    description: Succeeded is the number of child Promotions in the
                      Succeeded phase.
                    format: int32
                    type: integer
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
