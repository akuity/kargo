---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: promotionrequests.kargo.akuity.io
spec:
  group: kargo.akuity.io
  names:
    kind: PromotionRequest
    listKind: PromotionRequestList
    plural: promotionrequests
    shortNames:
    - promotionrequest
    - promotionrequests
    singular: promotionrequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.stage
      name: Stage
      type: string
    - jsonPath: .spec.freight
      name: Freight
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PromotionRequest expresses the intent to promote a piece of Freight to the
          Targets its Stage governs. It is a living object: the governing Stage owns
          its target selectors and keeps them in sync with the Stage's own, and its
          status reflects the current per-Target promotion state as Targets come and
          go -- closer to a ReplicaSet than to a Job.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              Spec describes the Stage, the Freight, and the target selectors of the
              PromotionRequest.
            properties:
              freight:
                description: |-
                  Freight specifies the piece of Freight promoted by the Stage.
                  The Freight MUST be in the same namespace as the PromotionRequest.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
                x-kubernetes-validations:
                - rule: self == oldSelf
              stage:
                description: |-
                  Stage specifies the name of the Stage that promotes the Freight.
                  The Stage MUST be in the same namespace as the PromotionRequest.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
                x-kubernetes-validations:
                - rule: self == oldSelf
              targetSelectors:
                description: |-
                  TargetSelectors select the Targets to which this PromotionRequest promotes
                  Freight, matching Targets by their labels within the PromotionRequest's
                  own Project. A Target is selected when it matches any selector in this
                  list. An empty selector in a non-empty list selects all Targets in the
                  Project; a list that matches nothing leaves the PromotionRequest with
                  nothing to do.

                  The governing Stage owns this field: the selectors are copied from the
                  Stage's own at creation and kept in sync when they change. Unlike Stage
                  and Freight, this field is expected to change over the PromotionRequest's
                  lifetime; the reconciler responds by creating Promotions for newly
                  selected Targets and recording resolution in status.
                items:
                  description: |-
                    A label selector is a label query over a set of resources. The result of matchLabels and
                    matchExpressions are ANDed. An empty label selector matches all objects. A null
                    label selector matches no objects.
                  properties:
                    matchExpressions:
                      description: matchExpressions is a list of label selector requirements.
                        The requirements are ANDed.
                      items:
                        description: |-
                          A label selector requirement is a selector that contains values, a key, and an operator that
                          relates the key and values.
                        properties:
                          key:
                            description: key is the label key that the selector applies
                              to.
                            type: string
                          operator:
                            description: |-
                              operator represents a key's relationship to a set of values.
                              Valid operators are In, NotIn, Exists and DoesNotExist.
                            type: string
                          values:
                            description: |-
                              values is an array of string values. If the operator is In or NotIn,
                              the values array must be non-empty. If the operator is Exists or DoesNotExist,
                              the values array must be empty. This array is replaced during a strategic
                              merge patch.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                        required:
                        - key
                        - operator
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                    matchLabels:
                      additionalProperties:
                        type: string
                      description: |-
                        matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                        map is equivalent to an element of matchExpressions, whose key field is "key", the
                        operator is "In", and the values array contains only "value". The requirements are ANDed.
                      type: object
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
            required:
            - freight
            - stage
            type: object
          status:
            description: |-
              Status describes the current resolution of the target selectors and the
              aggregate state of the PromotionRequest's Promotions.
            properties:
              conditions:
                description: |-
                  Conditions contains the last observations of the PromotionRequest's current
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              finishedAt:
                description: FinishedAt is the time at which the PromotionRequest
                  completed.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the spec last
                  reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is a high-level summary of the PromotionRequest's
                  lifecycle.
                type: string
              startedAt:
                description: StartedAt is the time at which the PromotionRequest started.
                format: date-time
                type: string
              summary:
                description: Summary aggregates the phases of this PromotionRequest's
                  child Promotions.
                properties:
                  aborted:
                    description: Aborted is the number of child Promotions in the
                      Aborted phase.
                    format: int32
                    type: integer
                  errored:
                    description: Errored is the number of child Promotions in the
                      Errored phase.
                    format: int32
                    type: integer
                  failed:
                    description: Failed is the number of child Promotions in the Failed
                      phase.
                    format: int32
                    type: integer
                  pending:
                    description: Pending is the number of child Promotions in the
                      Pending phase.
                    format: int32
                    type: integer
                  running:
                    description: Running is the number of child Promotions in the
                      Running phase.
                    format: int32
                    type: integer
                  succeeded:
                    description: Succeeded is the number of child Promotions in the
                      Succeeded phase.
                    format: int32
                    type: integer
                type: object
              targets:
                description: |-
                  Targets records the current resolution of the target selectors: one entry
                  per selected Target, with the child Promotion promoting to it and that
                  Promotion's phase. Entries come and go as the selectors and the Project's
                  Targets change.

                  The list is atomic rather than a map keyed by name: the reconciler is its
                  only writer, so per-item ownership tracking in managedFields would only
                  inflate the object -- roughly doubling the storage cost of each entry --
                  without ever being used to merge.
                items:
                  description: |-
                    PromotionRequestTargetStatus records the state of a single Target selected
                    by a PromotionRequest.
                  properties:
                    name:
                      description: Name is the name of the Target.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    phase:
                      description: Phase is the phase of that Promotion.
                      type: string
                    promotion:
                      description: |-
                        Promotion is the name of the child Promotion currently promoting the
                        Freight to this Target. Empty if none has been created yet.
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-type: atomic
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
