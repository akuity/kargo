{{- if and .Values.dataPlane.install .Values.managementController.enabled }}
# The management controller acts as its own ServiceAccount toward the API
# server, with short-lived tokens it requests for it, so it may create that
# ServiceAccount's tokens and no other's.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kargo-management-controller-token-requester
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kargo.labels" . | nindent 4 }}
    {{- include "kargo.managementController.labels" . | nindent 4 }}
  {{- include "kargo.annotations" (dict "root" . "annotations" .Values.managementController.annotations) | nindent 2 }}
rules:
- apiGroups:
  - ""
  resources:
  - serviceaccounts/token
  resourceNames:
  - kargo-management-controller
  verbs:
  - create
{{- end }}
