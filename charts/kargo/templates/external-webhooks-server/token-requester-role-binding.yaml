{{- if and .Values.workloads.install .Values.externalWebhooksServer.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kargo-external-webhooks-server-token-requester
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kargo.labels" . | nindent 4 }}
    {{- include "kargo.externalWebhooksServer.labels" . | nindent 4 }}
  {{- include "kargo.annotations" (dict "root" . "annotations" .Values.externalWebhooksServer.annotations) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kargo-external-webhooks-server-token-requester
subjects:
- kind: ServiceAccount
  namespace: {{ .Release.Namespace }}
  name: kargo-external-webhooks-server
{{- end }}
