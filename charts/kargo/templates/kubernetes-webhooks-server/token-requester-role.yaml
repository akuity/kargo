{{- if and .Values.workloads.install .Values.webhooksServer.enabled }}
# The webhooks server acts as its own ServiceAccount toward the API server,
# with short-lived tokens it requests for it, so it may create that
# ServiceAccount's tokens and no other's.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kargo-webhooks-server-token-requester
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kargo.labels" . | nindent 4 }}
    {{- include "kargo.kubernetesWebhooksServer.labels" . | nindent 4 }}
  {{- include "kargo.annotations" (dict "root" . "annotations" .Values.webhooksServer.annotations) | nindent 2 }}
rules:
- apiGroups:
  - ""
  resources:
  - serviceaccounts/token
  resourceNames:
  - kargo-webhooks-server
  verbs:
  - create
{{- end }}
