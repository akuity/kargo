{{- include "kargo.database.validate" . }}
{{- if include "kargo.migrations.enabled" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kargo.migrations.jobName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kargo.componentLabels" (dict "root" . "labels" .Values.database.migrations.labels) | nindent 4 }}
    {{- include "kargo.migrations.labels" . | nindent 4 }}
  {{- include "kargo.annotations" (dict "root" . "annotations" .Values.database.migrations.annotations) | nindent 2 }}
spec:
  backoffLimit: {{ .Values.database.migrations.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.database.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "kargo.labels" . | nindent 8 }}
        {{- include "kargo.migrations.labels" . | nindent 8 }}
      {{- with (mergeOverwrite (deepCopy .Values.global.podLabels) .Values.database.migrations.podLabels) }}
        {{- range $key, $value := . }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      {{- end }}
      {{- with (mergeOverwrite (deepCopy .Values.global.podAnnotations) .Values.database.migrations.podAnnotations) }}
      annotations:
        {{- range $key, $value := . }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      {{- end }}
    spec:
      # Each attempt gets a fresh Pod whose logs survive for inspection.
      restartPolicy: Never
      serviceAccountName: kargo-migrate
      {{- with .Values.database.migrations.affinity | default .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.database.migrations.priorityClassName | default .Values.global.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: migrate
        image: {{ include "kargo.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/sbin/tini", "--", "/usr/local/bin/kargo"]
        args: ["migrate"]
        env:
        - name: LOG_LEVEL
          value: {{ .Values.database.migrations.logLevel | quote }}
        - name: DATABASE_CONNECT_TIMEOUT
          value: {{ .Values.database.migrations.connectTimeout | quote }}
        - name: DATABASE_MIGRATION_LOCK_TIMEOUT
          value: {{ .Values.database.migrations.lockTimeout | quote }}
        {{- if .Values.database.postgres.enabled }}
        # The bundled database: the binary composes the connection string from
        # these parts, escaping the password, which a $(VAR) reference could
        # not.
        - name: DATABASE_HOST
          value: kargo-postgres.{{ .Release.Namespace }}.svc
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_NAME
          value: kargo
        - name: DATABASE_USER
          value: kargo
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "kargo.postgres.secretName" . }}
              key: password
        - name: DATABASE_SSL_MODE
          value: disable
        {{- else }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.database.external.secretName }}
              key: {{ .Values.database.external.secretKey }}
        {{- end }}
        {{- with (concat .Values.global.env .Values.database.migrations.env) }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
        {{- with (concat .Values.global.envFrom .Values.database.migrations.envFrom) }}
        envFrom:
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
        {{- with .Values.database.migrations.securityContext | default .Values.global.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml .Values.database.migrations.resources | nindent 10 }}
      {{- with .Values.database.migrations.nodeSelector | default .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.database.migrations.tolerations | default .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
