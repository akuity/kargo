{{- include "kargo.database.validate" . }}
{{- if include "kargo.migrations.enabled" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kargo-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kargo.labels" . | nindent 4 }}
    {{- include "kargo.migrations.labels" . | nindent 4 }}
  {{- with (mergeOverwrite (deepCopy .Values.global.serviceAccount.labels) .Values.database.migrations.serviceAccount.labels) }}
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
  {{- with (mergeOverwrite (deepCopy .Values.global.serviceAccount.annotations) .Values.database.migrations.serviceAccount.annotations) }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
