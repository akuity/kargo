{{- include "kargo.database.validate" . }}
{{- if and .Values.workloads.install .Values.database.postgres.enabled (not .Values.database.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: kargo-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kargo.componentLabels" (dict "root" . "labels" .Values.database.postgres.labels) | nindent 4 }}
    {{- include "kargo.postgres.labels" . | nindent 4 }}
  {{- include "kargo.annotations" (dict "root" . "annotations" .Values.database.postgres.annotations) | nindent 2 }}
{{- if not .Values.database.postgres.password }}
  {{- fail "A value MUST be provided for database.postgres.password unless database.postgres.existingSecret is specified" }}
{{- end }}
stringData:
  password: {{ quote .Values.database.postgres.password }}
{{- end }}
