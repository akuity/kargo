{{- if and .Values.workloads.install .Values.garbageCollector.enabled }}
# The garbage collector acts as its own ServiceAccount toward the API server,
# with short-lived tokens it requests for it, so it may create that
# ServiceAccount's tokens and no other's.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kargo-garbage-collector-token-requester
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kargo.labels" . | nindent 4 }}
    {{- include "kargo.garbageCollector.labels" . | nindent 4 }}
  {{- include "kargo.annotations" (dict "root" . "annotations" .Values.garbageCollector.annotations) | nindent 2 }}
rules:
- apiGroups:
  - ""
  resources:
  - serviceaccounts/token
  resourceNames:
  - kargo-garbage-collector
  verbs:
  - create
{{- end }}
